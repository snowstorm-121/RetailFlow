<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">RetailFlow — Local Retail Execution Agent</title>
  <desc id="desc">A local retail agent separates model decisions, explicit confirmation, business execution and recorded receipts.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#152b40"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <path d="M800 0v340M920 0v340M1040 0v340M1160 0v340M720 80h480M720 160h480M720 240h480M720 320h480" stroke="#b6e4ff" opacity=".045"/>
  <rect x="48" y="48" width="10" height="52" rx="5" fill="url(#accent)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="78" y="90" font-size="48" font-weight="750" fill="#f0f9ff">RetailFlow</text>
    <text x="50" y="133" font-size="18" fill="#a9c2d5">Local retail execution agent</text>
    <text x="50" y="184" font-size="17" fill="#d7e8f3">Native tool calls. Explicit confirmation. Durable receipts.</text>
    <g font-size="12" font-weight="650" letter-spacing="1">
      <rect x="50" y="219" width="120" height="30" rx="15" fill="#0c3344" stroke="#24677b"/><text x="110" y="239" text-anchor="middle" fill="#7dd3fc">LOCAL FIRST</text>
      <rect x="182" y="219" width="131" height="30" rx="15" fill="#143a39" stroke="#28665d"/><text x="247" y="239" text-anchor="middle" fill="#99f6e4">HUMAN REVIEW</text>
      <rect x="325" y="219" width="128" height="30" rx="15" fill="#25334c" stroke="#405a7d"/><text x="389" y="239" text-anchor="middle" fill="#c0d9ff">TRACEABLE</text>
    </g>
    <text x="50" y="297" font-size="12" fill="#6f93ac" letter-spacing="2">PYTHON / LANGGRAPH / OLLAMA / SQLITE</text>
    <path d="M837 125v18m0 58v18" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="m833 137 4 6 4-6m-8 76 4 6 4-6" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <g font-size="14">
      <rect x="688" y="69" width="298" height="56" rx="12" fill="#112d42" stroke="#28536b"/><text x="712" y="103" fill="#d8edf9">01</text><text x="750" y="103" fill="#f0f9ff">Model proposes an action</text>
      <rect x="688" y="145" width="298" height="56" rx="12" fill="#133a3c" stroke="#2d7774"/><text x="712" y="179" fill="#5eead4">02</text><text x="750" y="179" fill="#f0fdfa">User confirms exact parameters</text>
      <rect x="688" y="221" width="298" height="56" rx="12" fill="#112d42" stroke="#28536b"/><text x="712" y="255" fill="#d8edf9">03</text><text x="750" y="255" fill="#f0f9ff">Commit state and receipt</text>
    </g>
    <circle cx="1053" cy="174" r="43" fill="none" stroke="#2dd4bf" opacity=".2"/><circle cx="1053" cy="174" r="29" fill="#143a3c" stroke="#2dd4bf" opacity=".8"/>
    <path d="m1040 174 9 9 17-19" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
